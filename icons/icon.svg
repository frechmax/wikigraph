<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2c45"/><stop offset="1" stop-color="#0f1724"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#2f5d8a" stop-opacity=".55"/><stop offset="1" stop-color="#2f5d8a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- suggestion links (dotted) -->
  <g stroke="#e5b45f" stroke-width="7" stroke-linecap="round" stroke-dasharray="1 16" fill="none" opacity=".95">
    <path d="M256 250 L256 112"/><path d="M398 158 L256 112"/>
  </g>
  <!-- W-shaped reading path -->
  <path d="M114 158 L184 372 L256 250 L328 372 L398 158" fill="none" stroke="#dce8f5" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <!-- cross link -->
  <path d="M184 372 L328 372" fill="none" stroke="#dce8f5" stroke-width="7" stroke-dasharray="18 14" stroke-linecap="round" opacity=".45"/>
  <!-- ghost node -->
  <circle cx="256" cy="112" r="22" fill="#14202f" stroke="#e5b45f" stroke-width="7" stroke-dasharray="10 7"/>
  <!-- nodes -->
  <g stroke="#0f1724" stroke-width="8">
    <circle cx="114" cy="158" r="30" fill="#86b4e3"/>
    <circle cx="184" cy="372" r="36" fill="#86b4e3"/>
    <circle cx="256" cy="250" r="42" fill="#e58d75"/>
    <circle cx="328" cy="372" r="30" fill="#79c493"/>
    <circle cx="398" cy="158" r="34" fill="#79c493"/>
  </g>
</svg>
