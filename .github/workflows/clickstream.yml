name: Clickstream

# Builds the "next click" tables from the monthly Wikipedia clickstream dump
# and publishes them on the branch `clickstream` (served via raw.githubusercontent.com).
on:
  schedule:
    - cron: '17 7 5 * *'      # every month on the 5th (dumps appear ~3rd)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/clickstream.py', '.github/workflows/clickstream.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build tables
        env:
          LANGS: de en
          TOPK: '10'
          MIN_N: '15'
          TOPK_EN: '8'
          MIN_N_EN: '25'
        run: /usr/bin/time -v python scripts/clickstream.py 2>&1 | grep -v '^\s*$' | tail -40
      - name: Publish to branch clickstream
        run: |
          cd out
          git init -q -b clickstream
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Clickstream $(python -c 'import json;print(" ".join(k+":"+v["month"] for k,v in json.load(open("meta.json"))["langs"].items()))')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" clickstream
          du -sh .
